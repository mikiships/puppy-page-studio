<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Breeder Site</title>
  <style>
    :root {
      --ink: #18211f;
      --body: #46534f;
      --muted: #71807a;
      --paper: #f6f3ea;
      --white: #fffef9;
      --green: #244d41;
      --green-2: #dfeade;
      --blue: #2b6074;
      --cream: #eee2d0;
      --clay: #9e503f;
      --line: #dbd0c0;
      --gold: #b97b27;
      --sun: #f5b857;
      --shadow: 0 18px 44px rgba(24, 33, 31, .12);
    }

    * { box-sizing: border-box; }

    html, body { overflow-x: hidden; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Optima, Candara, "Avenir Next", "Segoe UI", sans-serif;
      line-height: 1.5;
      letter-spacing: 0;
    }

    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }

    .site {
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(36,77,65,.09) 0 1px, transparent 1px),
        linear-gradient(180deg, rgba(255,254,249,.98), rgba(246,243,234,.92) 62%, rgba(255,254,249,.96)),
        var(--paper);
      background-size: 88px 100%, auto;
    }

    .wrap {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    .nav {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid rgba(24, 33, 31, .11);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background:
        linear-gradient(135deg, transparent 0 42%, rgba(255,255,255,.64) 43% 55%, transparent 56%),
        linear-gradient(135deg, var(--green), #7a9e72);
      box-shadow: inset 0 0 0 2px rgba(255,254,249,.72);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--body);
      font-size: 14px;
      font-weight: 850;
    }

    .nav-links a {
      border-bottom: 2px solid transparent;
      padding: 9px 2px;
      font: inherit;
      color: inherit;
      cursor: pointer;
      white-space: nowrap;
    }

    .nav-links a:hover { border-bottom-color: var(--clay); color: var(--ink); }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, .78fr) minmax(390px, 1.22fr);
      gap: 44px;
      align-items: center;
      padding: 54px 0 58px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      color: var(--clay);
      font-size: 13px;
      font-weight: 900;
    }

    .eyebrow::before {
      content: "";
      width: 32px;
      height: 2px;
      background: var(--clay);
    }

    h1, h2, h3, p { margin-top: 0; overflow-wrap: break-word; }

    h1 {
      max-width: 620px;
      margin-bottom: 17px;
      font-family: "Iowan Old Style", Georgia, serif;
      font-size: clamp(42px, 5.4vw, 70px);
      line-height: .98;
      letter-spacing: 0;
    }

    .lead {
      max-width: 650px;
      color: var(--body);
      font-size: 20px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 17px;
      border: 1px solid var(--green);
      border-radius: 8px;
      background: var(--green);
      color: #fffef9;
      font-weight: 900;
    }

    .button.secondary {
      background: transparent;
      color: var(--green);
    }

    .photo-card {
      min-width: 0;
      width: 100%;
      overflow: hidden;
      border: 1px solid rgba(24, 33, 31, .12);
      border-radius: 16px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .photo-card img {
      width: 100%;
      aspect-ratio: 1.17 / .9;
      object-fit: cover;
    }

    .photo-caption {
      padding: 0;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0;
      color: var(--body);
      font-size: 15px;
      font-weight: 800;
    }

    .photo-caption span:first-child {
      padding: 18px 20px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: 0 18px;
      border-left: 1px solid var(--line);
      background: #f4efe5;
      color: var(--green);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .section {
      padding: 38px 0;
      border-top: 1px solid rgba(24, 33, 31, .1);
    }

    .section-head {
      max-width: 760px;
      margin-bottom: 18px;
    }

    .section h2 {
      margin-bottom: 9px;
      font-family: "Iowan Old Style", Georgia, serif;
      font-size: clamp(31px, 4vw, 48px);
      line-height: 1.04;
      letter-spacing: 0;
    }

    .section-head p {
      color: var(--body);
      font-size: 17px;
    }

    .puppy-grid,
    .trust-grid,
    .steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .card,
    .trust,
    .step,
    .plain-note {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,254,249,.92);
      box-shadow: 0 10px 26px rgba(24,33,31,.07);
    }

    .card { overflow: hidden; }

    .card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
    }

    .card-body,
    .trust,
    .step,
    .plain-note {
      padding: 18px;
    }

    .card h3,
    .trust h3,
    .step h3 {
      margin-bottom: 7px;
      font-family: "Iowan Old Style", Georgia, serif;
      font-size: 27px;
      line-height: 1.06;
      letter-spacing: 0;
    }

    .card p,
    .trust p,
    .step p,
    .plain-note p {
      color: var(--body);
      margin-bottom: 0;
    }

    .tagline {
      display: inline-flex;
      margin-top: 14px;
      min-height: 30px;
      align-items: center;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--green-2);
      color: var(--green);
      font-size: 12px;
      font-weight: 900;
    }

    .availability {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(260px, .9fr);
      gap: 18px;
      align-items: stretch;
    }

    .availability-list {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--line);
    }

    .availability-list li {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
      color: var(--body);
      font-weight: 750;
    }

    .availability-list strong {
      display: block;
      color: var(--ink);
      font-family: "Iowan Old Style", Georgia, serif;
      font-size: 23px;
      line-height: 1.08;
    }

    .availability-list em {
      display: inline-flex;
      align-items: center;
      height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: #f4efe5;
      color: var(--clay);
      font-size: 12px;
      font-style: normal;
      font-weight: 900;
      white-space: nowrap;
    }

    .care-panel {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px;
      background: #17211f;
      color: #fffef9;
    }

    .care-panel h3 {
      margin-bottom: 10px;
      font-family: "Iowan Old Style", Georgia, serif;
      font-size: 30px;
      line-height: 1.04;
    }

    .care-panel p {
      margin-bottom: 16px;
      color: rgba(255,255,255,.75);
    }

    .care-panel ul {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .care-panel li {
      padding-left: 18px;
      position: relative;
      color: rgba(255,255,255,.9);
      font-weight: 750;
    }

    .care-panel li::before {
      content: "";
      position: absolute;
      left: 0;
      top: .65em;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--sun);
    }

    .contact-band {
      margin: 34px 0 50px;
      border-radius: 18px;
      background: #17211f;
      color: #fffef9;
    }

    .contact-band .wrap {
      padding: 30px 0;
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: center;
    }

    .contact-band h2 {
      margin-bottom: 5px;
      font-family: "Iowan Old Style", Georgia, serif;
      font-size: 34px;
      line-height: 1.06;
    }

    .contact-band p { margin: 0; color: rgba(255,255,255,.76); }

    .contact-band .button {
      background: #fffef9;
      border-color: #fffef9;
      color: #17211f;
      flex: 0 0 auto;
    }

    .private-footnote {
      margin-bottom: 46px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 880px) {
      .nav,
      .contact-band .wrap {
        align-items: flex-start;
        flex-direction: column;
      }

      .nav-links {
        width: 100%;
        overflow-x: auto;
        padding-bottom: 8px;
      }

      .hero,
      .availability,
      .puppy-grid,
      .trust-grid,
      .steps {
        grid-template-columns: 1fr;
      }

      .hero > * {
        min-width: 0;
      }
    }

    @media (max-width: 560px) {
      .wrap { width: min(100% - 30px, 1180px); }
      .site,
      main,
      .hero,
      .section,
      .contact-band {
        max-width: 100vw;
        overflow: hidden;
      }
      .hero { padding-top: 32px; gap: 24px; }
      h1 {
        width: min(330px, 100%);
        max-width: min(330px, 100%);
        font-size: 28px;
        line-height: 1.06;
        overflow-wrap: anywhere;
      }
      .lead {
        width: min(330px, 100%);
        max-width: min(330px, 100%);
        font-size: 17px;
        overflow-wrap: anywhere;
      }
      .actions { flex-direction: column; align-items: stretch; }
      .button { width: 100%; }
      .card img { height: 205px; }
      .photo-card {
        justify-self: start;
        width: min(360px, calc(100vw - 30px));
        max-width: calc(100vw - 30px);
      }
      .photo-caption { display: block; }
      .photo-caption span {
        max-width: 100%;
        overflow-wrap: anywhere;
      }
      .photo-caption span:first-child { display: block; }
      .photo-caption .pill {
        width: 100%;
        min-height: 42px;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
      .availability-list li {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }
  </style>
</head>

  <div class="site" id="top">
    <header class="wrap nav">
      <a class="brand" href="#top" aria-label="Home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span id="brandName">Breeder preview</span>
      </a>
      <nav class="nav-links" aria-label="Page navigation">
        <a href="#top">Home</a>
        <a href="#puppies">Puppies</a>
        <a href="#trust">Care</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main>
      <section class="wrap hero">
        <div>
          <div class="eyebrow" id="eyebrow"></div>
          <h1 id="heroTitle"></h1>
          <p class="lead" id="heroLead"></p>
          <div class="actions">
            <a class="button" id="primaryAction" href="#contact">Ask about puppies</a>
            <a class="button secondary" id="sourceLink" href="#puppies">See puppies</a>
          </div>
        </div>
        <figure class="photo-card">
          <img id="heroImage" alt="">
          <figcaption class="photo-caption">
            <span id="photoText"></span>
            <span class="pill" id="photoPill"></span>
          </figcaption>
        </figure>
      </section>

      <section class="wrap section" id="puppies">
        <div class="section-head">
          <h2 id="puppyTitle"></h2>
          <p id="puppyIntro"></p>
        </div>
        <div class="puppy-grid" id="puppyGrid"></div>
      </section>

      <section class="wrap section" id="trust">
        <div class="section-head">
          <h2>Care details families look for</h2>
          <p id="trustIntro"></p>
        </div>
        <div class="availability">
          <ul class="availability-list" id="trustGrid"></ul>
          <aside class="care-panel">
            <h3>What families should know before they call</h3>
            <p id="carePanelText"></p>
            <ul id="carePanelList"></ul>
          </aside>
        </div>
      </section>

      <section class="wrap section" id="steps">
        <div class="section-head">
          <h2>How the next step works</h2>
          <p id="stepsIntro"></p>
        </div>
        <div class="steps" id="stepsGrid"></div>
      </section>

      <section class="contact-band" id="contact">
        <div class="wrap">
          <div>
            <h2 id="contactTitle"></h2>
            <p id="contactText"></p>
          </div>
          <a class="button" id="contactAction" href="#">Contact breeder</a>
        </div>
      </section>

      <section class="wrap private-footnote">
        <p>Private replacement-site preview for review only.</p>
      </section>
    </main>
  </div>

          ["2. Review health proof", "Genetic screening and guarantee details are easy to see."],
          ["3. Join the right path", "Families can inquire now or join the waitlist."]
        ]
      }
    };

    const params = new URLSearchParams(window.location.search);
    let active = params.get("site") || "happily";
    if (!previews[active]) active = "happily";

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    function render(siteKey) {
      const data = previews[siteKey];
      active = siteKey;
      document.title = data.name;
      history.replaceState(null, "", "?site=" + siteKey);

      document.getElementById("brandName").textContent = data.name;
      document.getElementById("eyebrow").textContent = data.eyebrow;
      document.getElementById("heroTitle").textContent = data.title;
      document.getElementById("heroLead").textContent = data.lead;
      document.getElementById("sourceLink").href = "#puppies";
      document.getElementById("heroImage").src = data.heroImage;
      document.getElementById("heroImage").alt = data.heroAlt;
      document.getElementById("photoText").textContent = data.photoText;
      document.getElementById("photoPill").textContent = data.photoPill;
      document.getElementById("puppyTitle").textContent = data.puppyTitle;
      document.getElementById("puppyIntro").textContent = data.puppyIntro;
      document.getElementById("trustIntro").textContent = data.trustIntro;
      document.getElementById("stepsIntro").textContent = data.stepsIntro;
      document.getElementById("contactTitle").textContent = data.contactTitle;
      document.getElementById("contactText").textContent = data.contactText;
      document.getElementById("contactAction").href = data.contactHref;

      const puppyGrid = document.getElementById("puppyGrid");
      puppyGrid.innerHTML = "";
      data.puppies.forEach((puppy) => {
        const card = el("article", "card");
        const img = el("img");
        img.src = puppy[3];
        img.alt = puppy[0];
        card.appendChild(img);
        const body = el("div", "card-body");
        body.appendChild(el("h3", "", puppy[0]));
        body.appendChild(el("p", "", puppy[1]));
        body.appendChild(el("span", "tagline", puppy[2]));
        card.appendChild(body);
        puppyGrid.appendChild(card);
      });

      const trustGrid = document.getElementById("trustGrid");
      trustGrid.innerHTML = "";
      data.trust.forEach((item) => {
        const row = el("li");
        const copy = el("span");
        copy.appendChild(el("strong", "", item[0]));
        copy.appendChild(document.createTextNode(item[1]));
        row.appendChild(copy);
        row.appendChild(el("em", "", item[2]));
        trustGrid.appendChild(row);
      });

      document.getElementById("carePanelText").textContent = data.carePanelText;
      const carePanelList = document.getElementById("carePanelList");
      carePanelList.innerHTML = "";
      data.carePanel.forEach((item) => carePanelList.appendChild(el("li", "", item)));

      const stepsGrid = document.getElementById("stepsGrid");
      stepsGrid.innerHTML = "";
      data.steps.forEach((item) => {
        const card = el("article", "step");
        card.appendChild(el("h3", "", item[0]));
        card.appendChild(el("p", "", item[1]));
        stepsGrid.appendChild(card);
      });
    }

    render(active);
  </script>
</body>
</html>
