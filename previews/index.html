<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Breeder Site</title>
  <style>
    :root {
      --ink: #201816;
      --body: #5e504a;
      --muted: #81736c;
      --paper: #fbf6ed;
      --paper-2: #efe3d4;
      --white: #fffdf8;
      --line: rgba(63, 46, 39, .16);
      --deep: #2d4f45;
      --deep-2: #173d3a;
      --accent: #b35d43;
      --accent-2: #dc9b5f;
      --butter: #f6d98f;
      --sage: #dfe8d8;
      --blue: #2b5f73;
      --shadow: 0 24px 70px rgba(38, 25, 18, .14);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; overflow-x: hidden; }
    body {
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background: var(--paper);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      line-height: 1.5;
      letter-spacing: 0;
    }

    body.heritage {
      --paper: #f4f0e7;
      --paper-2: #e6dcc9;
      --deep: #253c35;
      --deep-2: #162a28;
      --accent: #8f4b3d;
      --accent-2: #b88545;
      --butter: #e6c06a;
      --sage: #dce2d2;
      --blue: #345768;
    }

    body.clean {
      --paper: #f7faf6;
      --paper-2: #e4efe8;
      --deep: #164f55;
      --deep-2: #10373e;
      --accent: #cc6c45;
      --accent-2: #5b9a91;
      --butter: #f2cf75;
      --sage: #d7ece5;
      --blue: #236b83;
    }

    body.heritage .site {
      background:
        linear-gradient(90deg, rgba(37, 60, 53, .07) 0 1px, transparent 1px),
        radial-gradient(circle at 82% 16%, rgba(184, 133, 69, .22), transparent 26rem),
        linear-gradient(180deg, #fbf7ed, var(--paper) 52%, #eee6d7);
      background-size: 84px 100%, auto, auto;
    }

    body.clean .site {
      background:
        linear-gradient(180deg, #ffffff, var(--paper) 45%, #eef8f4),
        radial-gradient(circle at 86% 14%, rgba(91, 154, 145, .28), transparent 24rem);
    }

    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, p { margin-top: 0; overflow-wrap: break-word; }
    p { color: var(--body); }

    .site {
      min-height: 100vh;
      background:
        radial-gradient(circle at 8% 8%, rgba(246, 217, 143, .44), transparent 26rem),
        radial-gradient(circle at 88% 20%, rgba(223, 232, 216, .9), transparent 28rem),
        linear-gradient(180deg, var(--white), var(--paper) 46%, #fffaf1);
    }

    .wrap {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 20;
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--white) 88%, transparent);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      font-weight: 760;
    }

    .brand-mark {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, var(--butter) 0 15%, transparent 16%),
        linear-gradient(135deg, var(--deep), color-mix(in srgb, var(--deep) 50%, var(--accent-2)));
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.64);
    }

    .brand small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 680;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 18px;
      color: var(--body);
      font-size: 14px;
      font-weight: 700;
    }

    .nav-links a {
      border-bottom: 2px solid transparent;
      padding: 8px 0;
      white-space: nowrap;
    }

    .nav-links a:hover {
      color: var(--ink);
      border-bottom-color: var(--accent);
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, .94fr) minmax(420px, 1.06fr);
      gap: 38px;
      align-items: center;
      padding: 48px 0 38px;
    }

    body.heritage .hero {
      grid-template-columns: minmax(0, .9fr) minmax(430px, 1.1fr);
    }

    body.clean .hero {
      grid-template-columns: minmax(0, 1fr) minmax(410px, 1fr);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
    }

    .eyebrow::before {
      content: "";
      width: 34px;
      height: 2px;
      background: var(--accent);
    }

    h1 {
      max-width: 660px;
      margin-bottom: 18px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 3.7vw, 52px);
      line-height: 1.07;
      letter-spacing: 0;
    }

    body.heritage h1 {
      max-width: 560px;
      font-size: clamp(34px, 3.65vw, 50px);
    }

    body.clean h1 {
      max-width: 610px;
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      font-size: clamp(32px, 3.45vw, 48px);
      line-height: 1.08;
      font-weight: 820;
    }

    .lead {
      max-width: 670px;
      margin-bottom: 24px;
      color: var(--body);
      font-size: 18px;
      line-height: 1.55;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 22px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border: 1px solid var(--deep);
      border-radius: 999px;
      background: var(--deep);
      color: #fffdf8;
      font-weight: 820;
      box-shadow: 0 12px 28px rgba(45, 79, 69, .2);
    }

    .button.secondary {
      background: transparent;
      color: var(--deep);
      box-shadow: none;
    }

    .quick-facts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 690px;
    }

    .fact {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(255, 253, 248, .58);
    }

    .fact strong {
      display: inline;
      color: var(--ink);
      font-family: inherit;
      font-size: 13px;
      line-height: 1;
      font-weight: 850;
    }

    .fact span {
      display: inline;
      margin-top: 0;
      margin-left: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .hero-photo {
      position: relative;
      min-width: 0;
    }

    .photo-frame {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--white);
      box-shadow: var(--shadow);
      transform: rotate(.7deg);
    }

    body.heritage .photo-frame {
      border-radius: 10px;
      transform: none;
      box-shadow: 18px 18px 0 rgba(37, 60, 53, .12), var(--shadow);
    }

    body.clean .photo-frame {
      border-radius: 12px;
      transform: none;
      box-shadow: 0 18px 50px rgba(22, 79, 85, .13);
    }

    .photo-frame img {
      width: 100%;
      aspect-ratio: 1.08 / .78;
      object-fit: cover;
    }

    .photo-note {
      position: absolute;
      left: 18px;
      bottom: 18px;
      width: min(340px, calc(100% - 36px));
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 14px;
      padding: 14px 15px;
      background: rgba(32, 24, 22, .82);
      color: #fffaf1;
      box-shadow: 0 18px 40px rgba(32, 24, 22, .24);
    }

    body.heritage .photo-note {
      left: auto;
      right: 24px;
      bottom: 24px;
      border-radius: 6px;
      background: rgba(22, 42, 40, .92);
    }

    body.clean .photo-note {
      left: 22px;
      bottom: 22px;
      border-radius: 12px;
      background: rgba(16, 55, 62, .9);
    }

    .photo-note strong {
      display: block;
      margin-bottom: 4px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      line-height: 1.1;
    }

    .photo-note span {
      display: block;
      color: rgba(255,250,241,.77);
      font-size: 13px;
      font-weight: 650;
    }

    .section {
      padding: 40px 0;
      border-top: 1px solid var(--line);
    }

    .section-head {
      display: grid;
      grid-template-columns: minmax(0, .72fr) minmax(260px, .28fr);
      gap: 32px;
      align-items: end;
      margin-bottom: 24px;
    }

    .section-kicker {
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    h2 {
      margin-bottom: 9px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(29px, 3.35vw, 42px);
      line-height: 1.04;
      letter-spacing: 0;
    }

    .section-head p {
      margin-bottom: 0;
      font-size: 17px;
    }

    .small-note {
      border-left: 3px solid var(--accent);
      padding-left: 14px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }

    .puppy-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .puppy-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,253,248,.9);
      box-shadow: 0 16px 36px rgba(38, 25, 18, .08);
    }

    body.heritage .puppy-card,
    body.heritage .trust-list li,
    body.heritage .step {
      border-radius: 8px;
    }

    body.clean .puppy-card,
    body.clean .trust-list li,
    body.clean .step {
      border-radius: 12px;
      box-shadow: 0 10px 28px rgba(22, 79, 85, .06);
    }

    body.clean .puppy-card:first-child {
      grid-row: auto;
    }

    .puppy-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .puppy-card:first-child img {
      height: 250px;
    }

    .puppy-body {
      padding: 18px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      margin-bottom: 12px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--sage);
      color: var(--deep);
      font-size: 12px;
      font-weight: 800;
    }

    h3 {
      margin-bottom: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      line-height: 1.05;
      letter-spacing: 0;
    }

    .puppy-body p { margin-bottom: 0; }

    .care-layout {
      display: grid;
      grid-template-columns: minmax(0, .95fr) minmax(320px, 1.05fr);
      gap: 22px;
      align-items: stretch;
    }

    .care-panel {
      border-radius: 24px;
      padding: 28px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.06), transparent),
        var(--deep-2);
      color: #fffdf8;
      box-shadow: var(--shadow);
    }

    .care-panel h3 {
      color: #fffdf8;
      font-size: 32px;
    }

    .care-panel p {
      color: rgba(255,253,248,.76);
      font-size: 17px;
    }

    .care-list {
      display: grid;
      gap: 12px;
      margin: 24px 0 0;
      padding: 0;
      list-style: none;
    }

    .care-list li {
      position: relative;
      padding-left: 24px;
      color: rgba(255,253,248,.92);
      font-weight: 800;
    }

    .care-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: .65em;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--butter);
    }

    .trust-list {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .trust-list li {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      background: rgba(255,253,248,.88);
    }

    .trust-list strong {
      display: block;
      margin-bottom: 4px;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      line-height: 1.04;
    }

    .trust-list span {
      color: var(--body);
    }

    .trust-list em {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 0 11px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 13%, white);
      color: var(--accent);
      font-size: 12px;
      font-style: normal;
      font-weight: 800;
      white-space: nowrap;
    }

    .story-band {
      display: grid;
      grid-template-columns: minmax(0, .86fr) minmax(280px, .64fr);
      gap: 22px;
      align-items: stretch;
      border-radius: 28px;
      padding: 28px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.68), rgba(255,255,255,.22)),
        var(--paper-2);
    }

    .story-band h2 {
      max-width: 680px;
    }

    .story-card {
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 22px;
      background: rgba(255,253,248,.82);
    }

    .story-card ul {
      display: grid;
      gap: 11px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .story-card li {
      color: var(--body);
      font-weight: 800;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .step {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 21px;
      background: rgba(255,253,248,.88);
    }

    .step-number {
      display: inline-flex;
      width: 34px;
      height: 34px;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      border-radius: 50%;
      background: var(--deep);
      color: #fffdf8;
      font-weight: 950;
    }

    .contact-band {
      padding: 44px 0 58px;
    }

    .contact-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 26px;
      align-items: center;
      border-radius: 30px;
      padding: 30px;
      background: #201816;
      color: #fffdf8;
      box-shadow: var(--shadow);
    }

    .contact-card h2 {
      color: #fffdf8;
      font-size: clamp(32px, 4vw, 50px);
    }

    .contact-card p {
      max-width: 720px;
      margin-bottom: 0;
      color: rgba(255,253,248,.75);
    }

    .contact-card .button {
      border-color: #fffdf8;
      background: #fffdf8;
      color: #201816;
      box-shadow: none;
    }

    .footer {
      padding: 0 0 38px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 940px) {
      .hero,
      .section-head,
      .care-layout,
      .story-band,
      .contact-card {
        grid-template-columns: 1fr;
      }

      body.heritage .hero,
      body.clean .hero {
        grid-template-columns: 1fr;
      }

      .hero {
        padding-top: 36px;
      }

      .hero > *,
      .section-head > *,
      .care-layout > *,
      .story-band > *,
      .contact-card > * {
        min-width: 0;
      }

      .puppy-grid {
        grid-template-columns: 1fr 1fr;
      }

      .puppy-card:first-child {
        grid-column: span 2;
        grid-row: auto;
      }

      .photo-note {
        left: 18px;
        bottom: 18px;
      }
    }

    @media (max-width: 680px) {
      .wrap { width: min(100% - 30px, 1180px); }

      .site,
      main,
      .hero,
      .section,
      .contact-band {
        max-width: 100vw;
        overflow: hidden;
      }

      .nav {
        position: static;
        align-items: flex-start;
        flex-direction: column;
        padding: 14px 0;
      }

      .nav-links {
        width: 100%;
        gap: 14px;
        overflow-x: auto;
        padding-bottom: 6px;
      }

      h1 {
        width: min(100%, 360px);
        max-width: min(100%, 360px);
        font-size: 27px;
        line-height: 1.08;
        overflow-wrap: anywhere;
      }

      .lead {
        width: min(100%, 360px);
        max-width: min(100%, 360px);
        font-size: 16px;
        overflow-wrap: anywhere;
      }

      .hero-actions {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }

      .quick-facts,
      .puppy-grid,
      .steps {
        grid-template-columns: 1fr;
      }

      .puppy-card:first-child {
        grid-column: auto;
      }

      .puppy-card:first-child img,
      .puppy-card img {
        height: 218px;
      }

      .photo-frame {
        width: 100%;
        max-width: 100%;
        transform: none;
      }

      .photo-frame img {
        width: 100%;
      }

      .photo-note {
        position: static;
        width: 100%;
        border-radius: 0 0 24px 24px;
      }

      .trust-list li {
        grid-template-columns: 1fr;
      }

      .story-band,
      .care-panel,
      .contact-card {
        padding: 22px;
        border-radius: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="site" id="top">
    <header class="wrap nav">
      <a class="brand" href="#top" aria-label="Home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span><span id="brandName">Breeder site</span><small id="brandSubhead"></small></span>
      </a>
      <nav class="nav-links" aria-label="Page navigation">
        <a href="#top">Home</a>
        <a href="#puppies">Puppies</a>
        <a href="#care">Care</a>
        <a href="#story">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main>
      <section class="wrap hero">
        <div>
          <div class="eyebrow" id="eyebrow"></div>
          <h1 id="heroTitle"></h1>
          <p class="lead" id="heroLead"></p>
          <div class="hero-actions">
            <a class="button" href="#contact" id="primaryAction">Ask about a puppy</a>
            <a class="button secondary" href="#puppies">See puppies</a>
          </div>
          <div class="quick-facts" id="quickFacts"></div>
        </div>
        <div class="hero-photo">
          <figure class="photo-frame">
            <img id="heroImage" alt="">
          </figure>
          <div class="photo-note">
            <strong id="photoTitle"></strong>
            <span id="photoText"></span>
          </div>
        </div>
      </section>

      <section class="wrap section" id="puppies">
        <div class="section-head">
          <div>
            <div class="section-kicker">Available puppies</div>
            <h2 id="puppyTitle"></h2>
            <p id="puppyIntro"></p>
          </div>
          <div class="small-note" id="puppyNote"></div>
        </div>
        <div class="puppy-grid" id="puppyGrid"></div>
      </section>

      <section class="wrap section" id="care">
        <div class="section-head">
          <div>
            <div class="section-kicker">Care and trust</div>
            <h2 id="careTitle"></h2>
            <p id="careIntro"></p>
          </div>
          <div class="small-note" id="careNote"></div>
        </div>
        <div class="care-layout">
          <aside class="care-panel">
            <h3 id="carePanelTitle"></h3>
            <p id="carePanelText"></p>
            <ul class="care-list" id="carePanelList"></ul>
          </aside>
          <ul class="trust-list" id="trustGrid"></ul>
        </div>
      </section>

      <section class="wrap section" id="story">
        <div class="story-band">
          <div>
            <div class="section-kicker">About the breeder</div>
            <h2 id="storyTitle"></h2>
            <p id="storyText"></p>
          </div>
          <aside class="story-card">
            <h3 id="storyCardTitle"></h3>
            <ul id="storyList"></ul>
          </aside>
        </div>
      </section>

      <section class="wrap section" id="next">
        <div class="section-head">
          <div>
            <div class="section-kicker">Next steps</div>
            <h2 id="stepsTitle"></h2>
            <p id="stepsIntro"></p>
          </div>
        </div>
        <div class="steps" id="stepsGrid"></div>
      </section>

      <section class="contact-band" id="contact">
        <div class="wrap contact-card">
          <div>
            <h2 id="contactTitle"></h2>
            <p id="contactText"></p>
          </div>
          <a class="button" id="contactAction" href="#">Contact breeder</a>
        </div>
      </section>

      <footer class="wrap footer" id="footerText"></footer>
    </main>
  </div>

  <script>
    const previews = {
      happily: {
        lane: "warm",
        name: "Happily Ever After Dachshunds",
        subhead: "Mini dachshunds in Mississippi",
        eyebrow: "Home-raised miniature dachshunds",
        source: "https://www.happily-ever-after-dachshunds.com/",
        title: "Mini dachshunds, raised at home by Lyn.",
        lead: "Current puppy notes, care basics, and a direct way to ask Lyn about timing.",
        heroImage: "https://primary.jwwb.nl/public/r/q/s/temp-tqbdtxvdxvbcbgjynogw/img_0663-high.jpg?enable-io=true&enable=upscale&crop=0.8333%3A1&width=900",

    const params = new URLSearchParams(window.location.search);
    let active = params.get("site") || "happily";
    if (!previews[active]) active = "happily";

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function render(siteKey) {
      const data = previews[siteKey];
      active = siteKey;
      document.body.className = data.lane === "heritage" ? "heritage" : data.lane === "clean" ? "clean" : "";
      document.title = data.name;
      history.replaceState(null, "", "?site=" + siteKey);

      document.getElementById("brandName").textContent = data.name;
      document.getElementById("brandSubhead").textContent = data.subhead;
      document.getElementById("eyebrow").textContent = data.eyebrow;
      document.getElementById("heroTitle").textContent = data.title;
      document.getElementById("heroLead").textContent = data.lead;
      document.getElementById("heroImage").src = data.heroImage;
      document.getElementById("heroImage").alt = data.heroAlt;
      document.getElementById("photoTitle").textContent = data.photoTitle;
      document.getElementById("photoText").textContent = data.photoText;
      document.getElementById("puppyTitle").textContent = data.puppyTitle;
      document.getElementById("puppyIntro").textContent = data.puppyIntro;
      document.getElementById("puppyNote").textContent = data.puppyNote;
      document.getElementById("careTitle").textContent = data.careTitle;
      document.getElementById("careIntro").textContent = data.careIntro;
      document.getElementById("careNote").textContent = data.careNote;
      document.getElementById("carePanelTitle").textContent = data.carePanelTitle;
      document.getElementById("carePanelText").textContent = data.carePanelText;
      document.getElementById("storyTitle").textContent = data.storyTitle;
      document.getElementById("storyText").textContent = data.storyText;
      document.getElementById("storyCardTitle").textContent = data.storyCardTitle;
      document.getElementById("stepsTitle").textContent = data.stepsTitle;
      document.getElementById("stepsIntro").textContent = data.stepsIntro;
      document.getElementById("contactTitle").textContent = data.contactTitle;
      document.getElementById("contactText").textContent = data.contactText;
      document.getElementById("contactAction").href = data.contactHref;
      document.getElementById("footerText").textContent = data.footer;

      const facts = document.getElementById("quickFacts");
      facts.innerHTML = "";
      data.facts.forEach((fact) => {
        const box = el("div", "fact");
        box.appendChild(el("strong", "", fact[0]));
        box.appendChild(el("span", "", fact[1]));
        facts.appendChild(box);
      });

      const puppyGrid = document.getElementById("puppyGrid");
      puppyGrid.innerHTML = "";
      data.puppies.forEach((puppy) => {
        const card = el("article", "puppy-card");
        const img = el("img");
        img.src = puppy[3];
        img.alt = puppy[0];
        img.onerror = () => {
          img.onerror = null;
          img.src = data.heroImage;
        };
        card.appendChild(img);
        const body = el("div", "puppy-body");
        body.appendChild(el("span", "status", puppy[2]));
        body.appendChild(el("h3", "", puppy[0]));
        body.appendChild(el("p", "", puppy[1]));
        card.appendChild(body);
        puppyGrid.appendChild(card);
      });

      const carePanelList = document.getElementById("carePanelList");
      carePanelList.innerHTML = "";
      data.carePanel.forEach((item) => carePanelList.appendChild(el("li", "", item)));

      const trustGrid = document.getElementById("trustGrid");
      trustGrid.innerHTML = "";
      data.trust.forEach((item) => {
        const row = el("li");
        const copy = el("span");
        copy.appendChild(el("strong", "", item[0]));
        copy.appendChild(document.createTextNode(item[1]));
        row.appendChild(copy);
        row.appendChild(el("em", "", item[2]));
        trustGrid.appendChild(row);
      });

      const storyList = document.getElementById("storyList");
      storyList.innerHTML = "";
      data.storyList.forEach((item) => storyList.appendChild(el("li", "", item)));

      const stepsGrid = document.getElementById("stepsGrid");
      stepsGrid.innerHTML = "";
      data.steps.forEach((item, index) => {
        const card = el("article", "step");
        card.appendChild(el("span", "step-number", String(index + 1)));
        card.appendChild(el("h3", "", item[0]));
        card.appendChild(el("p", "", item[1]));
        stepsGrid.appendChild(card);
      });
    }

    render(active);
  </script>
